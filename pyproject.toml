[project]
name = "knowledgeforge"
version = "0.1.0"
description = "A local-first Retrieval-Augmented Generation (RAG) chatbot over your own documents."
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.60.0",
    "langchain==1.3.14",
    "langchain-core==1.5.0",
    "langchain-community==0.4.2",
    "langchain-ollama==1.1.0",
    "langchain-chroma==1.1.0",
    "langchain-text-splitters==1.1.2",
    "chromadb==1.5.9",
    "rank-bm25==0.2.2",
    "pandas==3.0.5",
    "pymupdf==1.28.0",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
