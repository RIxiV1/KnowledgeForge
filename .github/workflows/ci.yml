name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Prefer the packaged dev extra (pytest + ruff); fall back to requirements.
          pip install -e ".[dev]" || pip install -r requirements.txt pytest ruff

      - name: Lint new test code with ruff (blocking)
        run: ruff check tests conftest.py

      - name: Lint whole repo with ruff (non-blocking; pre-existing issues)
        run: ruff check . || true

      - name: Run tests (offline, Ollama-dependent tests skipped)
        run: pytest -m "not ollama" -q
